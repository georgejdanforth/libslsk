name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        run: zig build fmt
      - name: Build
        run: zig build --summary all
      - name: Test
        run: zig build test --summary all
      # A short fuzz run on Linux only. The decoders do not depend on the platform.
      # In Zig 0.17.1, `zig build test --fuzz` exits with 0 even when a fuzz test fails, so this
      # step checks for the crash input file. To reproduce a failure, download the fuzz-crash
      # artifact and add its bytes to the corpus of the failing test.
      - name: Fuzz tests
        if: runner.os == 'Linux'
        run: |
          rm -f .zig-cache/f/crash
          zig build test --fuzz=50K --summary all
          if [ -f .zig-cache/f/crash ]; then
            echo "::error::A fuzz test failed. The fuzz-crash artifact has the input."
            exit 1
          fi
      - name: Upload the fuzz crash input
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: .zig-cache/f/crash
          if-no-files-found: ignore
      - name: Integration tests skip without SLSK_SOULFIND
        run: zig build itest --summary all

  # GitHub macOS runners do not have Docker, so integration tests run on Linux only.
  itest:
    name: itest (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Start Soulfind
        run: scripts/soulfind.sh up
      - name: Integration tests
        env:
          SLSK_SOULFIND: 127.0.0.1:2242
        run: zig build itest --summary all
      - name: Soulfind logs
        if: failure()
        run: docker logs slsk-soulfind
      - name: Stop Soulfind
        if: always()
        run: scripts/soulfind.sh down
