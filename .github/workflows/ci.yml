name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        run: zig build fmt
      - name: Build
        run: zig build --summary all
      - name: Test
        run: zig build test --summary all
      - name: Integration tests skip without SLSK_SOULFIND
        run: zig build itest --summary all

  # GitHub macOS runners do not have Docker, so integration tests run on Linux only.
  itest:
    name: itest (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Start Soulfind
        run: scripts/soulfind.sh up
      - name: Integration tests
        env:
          SLSK_SOULFIND: 127.0.0.1:2242
        run: zig build itest --summary all
      - name: Soulfind logs
        if: failure()
        run: docker logs slsk-soulfind
      - name: Stop Soulfind
        if: always()
        run: scripts/soulfind.sh down
